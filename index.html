<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ce luăm?">
<meta name="theme-color" content="#F3F4EF">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Ce luăm?</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4EF; --card:#FFFFFF; --ink:#161A17; --muted:#5D645F; --line:#ECEEE8; --edge:#D5D9D1;
  --accent:#1F6F4A; --accent-ink:#16573A; --soft:#E4EDE6; --soft-ink:#1F4D35; --danger:#A3352A;
  --display:'Bricolage Grotesque', Geist, system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Geist, system-ui, -apple-system, sans-serif;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 26px) 18px calc(env(safe-area-inset-bottom) + 190px)}
.top{display:flex;align-items:flex-end;gap:10px;padding:0 4px;margin-bottom:18px}
.top .t{flex:1;display:flex;flex-direction:column;gap:6px}
.date{margin:0;font-size:13px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap}
.sync{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.sync i{width:7px;height:7px;border-radius:9px;background:#B8BEB9;display:inline-block}
.sync.on i{background:var(--accent)}
h1{margin:0;font-family:var(--display);font-size:42px;line-height:1;font-weight:700;letter-spacing:-.02em}
.me{overflow:hidden;padding:0;width:44px;height:44px;border-radius:99px;border:0;background:var(--card);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center}
.pills{display:flex;gap:8px;margin-bottom:16px}
.pill{height:44px;padding:0 20px;border-radius:99px;border:1px solid var(--edge);background:transparent;font-size:15px;font-weight:500}

.pills{flex-wrap:wrap}
.pill.add{width:44px;padding:0;font-size:22px;font-weight:400;color:var(--muted)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.go{display:flex;align-items:center;gap:14px;padding:16px 16px 16px 20px;border-radius:22px;background:var(--accent);color:#fff;margin-bottom:18px}
.go .c{flex:1;display:flex;flex-direction:column;gap:2px}
.go small{font-size:13px;opacity:.85}
.go b{font-family:var(--display);font-size:22px;font-weight:700}
.go button{height:44px;padding:0 18px;border-radius:99px;border:0;background:#fff;color:var(--accent);font-size:15px;font-weight:600;white-space:nowrap}
.banner{padding:14px 16px;border-radius:18px;background:var(--soft);color:var(--soft-ink);font-size:15px;line-height:1.4;margin-bottom:16px}
.lbl{margin:0 4px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{height:40px;padding:0 14px;border-radius:99px;border:0;background:var(--card);font-size:14px;font-weight:500}
.chip.soft{background:var(--soft);color:var(--soft-ink)}
.group{background:var(--card);border-radius:22px;padding:14px 16px 4px;margin-bottom:12px}
.gh{display:flex;align-items:center;gap:10px;padding-bottom:4px}
.gh h2{margin:0;flex:1;font-size:15px;font-weight:600}
.gh span.n{font-size:13px;color:var(--muted)}
.ic{width:32px;height:32px;border-radius:99px;display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:18px;height:18px}
.emo{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;font-size:24px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.emo.s{width:32px;height:32px;border-radius:10px;font-size:19px}
.ph{width:40px;height:40px;border-radius:12px;object-fit:cover;flex:none;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.ph.s{width:32px;height:32px;border-radius:10px}
.photo{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.photo img{width:110px;height:110px;border-radius:20px;object-fit:contain;background:#fff;flex:none}
.photo .ph-empty{width:110px;height:110px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:56px;flex:none}
.photo label{position:relative;display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 18px;border-radius:24px;background:var(--card);border:1px solid var(--edge);font-weight:600;font-size:15px;cursor:pointer}
.photo input{position:absolute;width:1px;height:1px;opacity:0}
.photo small{display:block;margin-top:8px;font-size:13px;color:var(--muted);line-height:1.4}
.row{display:flex;align-items:center;gap:8px;min-height:58px;border-top:1px solid var(--line)}
.tick{width:44px;height:44px;margin-left:-10px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.tick span{width:24px;height:24px;border-radius:99px;border:1.75px solid #A3AAA4;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.tick:active span{transform:scale(.85)}
.tick.done span{background:var(--accent);border-color:var(--accent);color:#fff}
.rbody{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:52px;border:0;background:transparent;padding:0;text-align:left}
.rtext{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rname{font-size:16px;font-weight:500;overflow-wrap:anywhere}
.rnote{font-size:13px;color:var(--muted)}
.rqty{font-size:15px;font-weight:600;white-space:nowrap}
.who{overflow:hidden;width:24px;height:24px;border-radius:99px;background:var(--line);color:#3A413C;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.cart{padding:6px 4px 0}
.cart .row{border-top:0;min-height:50px}
.cart .rname{color:var(--muted);text-decoration:line-through}
.cart .rqty{color:var(--muted);font-weight:500}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;padding:10px 4px;min-height:44px}
.empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5;background:var(--card);border-radius:22px;margin-bottom:12px}
.empty b{display:block;font-family:var(--display);font-size:22px;color:var(--ink);margin-bottom:6px}

/* bara de jos */
.bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:20;display:flex;justify-content:center;pointer-events:none}
.barin{width:100%;max-width:520px;padding:0 14px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:56px;padding:0 18px;border-radius:28px;background:rgba(255,255,255,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(22,26,23,.08);box-shadow:0 10px 30px rgba(22,26,23,.10);color:#3A413C}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;outline:none}
.search input::placeholder{color:#6B726D}
.barin .search{flex:1;min-width:0}
.srow{display:flex;gap:8px;align-items:center}
.cam{position:relative;flex:none;height:56px;padding:0 16px;border-radius:28px;background:var(--accent);color:#fff;display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 10px 30px rgba(22,26,23,.12)}
.cam input{position:absolute;width:1px;height:1px;opacity:0}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:5px;height:62px;border-radius:24px;background:rgba(22,26,23,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.tab{height:52px;border-radius:19px;border:0;background:transparent;color:#C9CEC9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;padding:0}
.tab span{line-height:1}
.tab.on{background:#fff;color:var(--ink)}
.sugg{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 150px);z-index:19;display:flex;justify-content:center;pointer-events:none}
.suggin{width:100%;max-width:520px;padding:0 14px;pointer-events:auto}
.sbox{background:var(--card);border-radius:22px;box-shadow:0 12px 40px rgba(22,26,23,.16);padding:6px;max-height:52vh;overflow-y:auto}
.sopt{width:100%;display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 10px;border:0;background:transparent;border-radius:14px;text-align:left}
.sopt:active{background:var(--line)}
.sopt .nm{flex:1;font-size:16px}
.sopt .un{font-size:13px;color:var(--muted)}
.sopt .ic{width:30px;height:30px}

/* meniu */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:18px}
.wd{height:64px;border-radius:18px;border:0;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.wd small{font-size:12px;font-weight:500;color:var(--muted)}
.wd b{font-size:18px;font-weight:600}
.wd i{width:5px;height:5px;border-radius:9px;background:var(--accent)}
.wd.today{background:var(--ink);color:#fff}
.wd.today small{color:#fff;opacity:.8}
.wd.today i{background:#fff}
.arrows{display:flex;gap:8px}
.arr{width:44px;height:44px;border-radius:99px;border:1px solid var(--edge);background:transparent;display:flex;align-items:center;justify-content:center}
.day{width:100%;display:flex;align-items:center;gap:16px;padding:16px 16px 16px 18px;border-radius:22px;background:var(--card);border:0;text-align:left;margin-bottom:10px}
.day.e{background:transparent;border:1.5px dashed #C9CEC6;padding:14px 16px 14px 18px}
.dd{width:46px;display:flex;flex-direction:column;flex:none}
.dd small{font-size:12px;font-weight:600;color:var(--muted)}
.dd b{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.1}
.day.e .dd b{color:var(--muted)}
.dt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dt b{font-family:var(--display);font-size:20px;font-weight:500;line-height:1.15}
.dt small{font-size:13px;color:var(--muted)}
.day.e .dt{font-size:15px;font-weight:500;color:#3A413C}
.day.now{box-shadow:inset 0 0 0 2px var(--accent)}
.big{width:100%;height:56px;border-radius:28px;border:0;background:var(--accent);color:#fff;font-size:16px;font-weight:600;margin-top:8px}
.big:disabled{background:#B8BEB9}

/* foaia de jos */
.veil{position:fixed;inset:0;background:rgba(22,26,23,.32);z-index:40;opacity:0;transition:opacity .2s}
.veil.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;display:flex;justify-content:center;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheetin{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 22px)}
.grab{width:40px;height:5px;border-radius:9px;background:#C9CEC6;margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-family:var(--display);font-size:26px;font-weight:700}
.sheet .sub{margin:0 0 18px;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field > span{font-size:13px;font-weight:600;color:var(--muted)}
.inp{height:52px;border-radius:16px;border:1px solid var(--edge);background:var(--card);padding:0 14px;font-size:16px;outline:none;width:100%}
.inp:focus{border-color:var(--accent)}
.step{display:flex;align-items:center;gap:12px}
.step button{width:52px;height:52px;border-radius:16px;border:1px solid var(--edge);background:var(--card);font-size:22px;font-weight:500}
.step b{flex:1;text-align:center;font-family:var(--display);font-size:26px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:16px;background:var(--line)}
.seg button{height:44px;border-radius:12px;border:0;background:transparent;font-size:14px;font-weight:500;color:#3A413C}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(22,26,23,.1)}
.acts{display:flex;gap:10px;margin-top:8px}
.acts button{flex:1;height:52px;border-radius:26px;border:0;font-size:16px;font-weight:600}
.btn-p{background:var(--accent);color:#fff}
.btn-s{background:var(--card);color:var(--ink);border:1px solid var(--edge)!important}
.btn-d{background:transparent;color:var(--danger)}
.ingr{display:flex;align-items:center;gap:10px;min-height:52px;padding:4px 4px 4px 14px;background:var(--card);border-radius:16px;margin-bottom:6px}
.ingr .nm{flex:1;font-size:15px}
.ingr .q{display:flex;align-items:center;gap:2px}
.ingr .q button,.ingr .x{width:40px;height:40px;border-radius:12px;border:0;background:transparent;font-size:18px;color:#3A413C}
.ingr .q span{min-width:64px;text-align:center;font-size:14px;font-weight:600}
.check{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:4px 14px 4px 4px;border:0;background:var(--card);border-radius:16px;margin-bottom:6px;text-align:left}
.check .nm{flex:1;font-size:15px}
.check .q{font-size:14px;color:var(--muted)}
.check.off .nm{color:var(--muted);text-decoration:line-through}
.people{display:flex;flex-direction:column;gap:10px}
.person{height:60px;border-radius:20px;border:0;background:var(--card);font-size:18px;font-weight:600;display:flex;align-items:center;gap:14px;padding:0 16px}
.person i{overflow:hidden;width:36px;height:36px;border-radius:99px;background:var(--soft);color:var(--soft-ink);font-style:normal;display:flex;align-items:center;justify-content:center;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 158px);transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-size:14px;max-width:88vw;text-align:center;transition:all .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.days7{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.days7 button{height:52px;border-radius:16px;border:0;background:var(--card);font-size:15px;font-weight:500}
.hint{font-size:13px;color:var(--muted);line-height:1.45;margin:4px 4px 16px}
/* rețete */
.rcard{width:100%;display:flex;align-items:center;gap:16px;padding:12px 16px 12px 12px;border-radius:24px;background:var(--card);border:0;text-align:left;margin-bottom:10px}
.rhero{width:76px;height:76px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:42px;flex:none;object-fit:cover;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.rcard .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rcard .rt b{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.15}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{font-size:12px;font-weight:500;color:#3A413C;background:var(--line);padding:4px 9px;border-radius:99px}
.rbig{width:100%;height:150px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:84px;margin-bottom:16px;object-fit:cover;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.intro{font-size:15px;line-height:1.55;color:#2C322E;margin:12px 0 18px}
.sec{font-family:var(--display);font-size:20px;font-weight:700;margin:22px 0 10px}
.portii{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:8px 8px 8px 16px;margin-bottom:10px}
.portii span{flex:1;font-size:15px;font-weight:500}
.portii button{width:44px;height:44px;border-radius:14px;border:1px solid var(--edge);background:var(--bg);font-size:20px}
.portii b{min-width:28px;text-align:center;font-size:18px}
.ring{background:var(--card);border-radius:18px;padding:4px 16px}
.ri{display:flex;align-items:center;gap:12px;min-height:54px;border-top:1px solid var(--line);padding:6px 0}
.ri:first-child{border-top:0}
.ri .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ri .tx span{font-size:16px;font-weight:500}
.ri .tx small{font-size:13px;color:var(--muted)}
.ri .am{font-size:15px;font-weight:600;text-align:right;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:14px;background:var(--card);border-radius:18px;padding:16px}
.steps li > b{width:32px;height:32px;border-radius:99px;background:var(--soft);color:var(--soft-ink);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.steps li div{flex:1;font-size:15px;line-height:1.55}
.steps li div strong{display:block;font-size:16px;margin-bottom:2px}
.tips{background:var(--soft);color:var(--soft-ink);border-radius:18px;padding:14px 16px;font-size:15px;line-height:1.55}
.tips p{margin:0 0 8px}.tips p:last-child{margin:0}
.src{display:block;margin:16px 4px 4px;font-size:14px;color:var(--accent);font-weight:600;text-decoration:none;padding:8px 0}
.rbtns{display:flex;gap:10px;margin:14px 0 4px}
.rbtns button{flex:1;height:52px;border-radius:26px;border:0;font-size:15px;font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app" id="app"></main>

<div class="sugg" id="sugg" hidden><div class="suggin"><div class="sbox" id="sbox" role="listbox" aria-label="Sugestii"></div></div></div>

<nav class="bar" aria-label="Bara de jos">
  <div class="barin">
    <div class="srow">
    <label class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="text" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Adaugă un produs" placeholder="Ce mai trebuie?">
    </label>
    <label class="cam" id="cambtn" aria-label="Fă o poză la un produs"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Poză</span><input type="file" accept="image/*" capture="environment" id="camfile">
    </label>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab on" id="tab-lista" role="tab" data-a="tab" data-v="lista"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Lista</span></button>
      <button class="tab" id="tab-meniu" role="tab" data-a="tab" data-v="meniu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Meniul</span></button>
      <button class="tab" id="tab-retete" role="tab" data-a="tab" data-v="retete"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 7.5h6M9 11h4"/></svg><span>Rețete</span></button>
    </div>
  </div>
</nav>

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function gh(path, opts) {
  opts = opts || {};
  const h = Object.assign({ Authorization: 'Bearer ' + GH.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, opts.headers || {});
  return fetch('https://api.github.com/repos/' + GH.owner + '/' + GH.repo + path, Object.assign({}, opts, { headers: h, cache: 'no-store' }));

const b64e = (str) => { const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); };

async function readCol(c) {

  if (!r.ok) throw r;

async function writeCol(c, mutate, msg) {
  for (let t = 0; t < 5; t++) {
    const cur = await readCol(c);
    mutate(cur.obj);
    const body = { message: msg, content: b64e(JSON.stringify(cur.obj, null, 1)), branch: GH.branch };
    if (cur.sha) body.sha = cur.sha;
    const r = await gh('/contents/data/' + c + '.json', { method: 'PUT', body: JSON.stringify(body) });
    if (r.ok) return;

async function maybeSeed() {
  const probe = await readCol('recipes');
  if (!probe.missing) return;
  let seed = null;
  try { const r = await fetch('seed.json', { cache: 'no-store' }); if (r.ok) seed = await r.json(); } catch (e) {}
  if (!seed) return;
  for (const c of COLS) {
    const add = seed[c]; if (!add || !Object.keys(add).length) continue;
    await writeCol(c, (obj) => { for (const k in add) if (!(k in obj)) obj[k] = add[k]; }, 'Date de început: ' + c);

const COLS = ['items', 'menu', 'dishes', 'queue', 'meta', 'photos', 'recipes', 'stores'];
const S = { items: [], menu: [], dishes: [], queue: [], meta: [], photos: [], recipes: [], stores: [] };
let ASSETS = null;
const Store = {
  mode: 'local', db: null, unsubs: [],
  local: ls.get('data', { items: {}, menu: {}, dishes: {}, queue: {}, meta: {} }),
  chains: {},
  startLocal() {
    this.mode = 'local';
    for (const c of COLS) this.emitLocal(c);
  },
  emitLocal(c) {
    const o = this.local[c] || {};
    S[c] = Object.keys(o).map((id) => Object.assign({ id: id }, o[id]));

  },
  /* GitHub: datele stau în repo-ul privat, câte un fișier JSON pe colecție */
  pending: {}, timers: {}, flushing: {}, lastHead: '',
  async startGH() {
    this.mode = 'remote'; syncState = 'slow'; render();
    try {
      await maybeSeed();
      await this.pull(true);
    } catch (e) { syncState = 'off'; render(); }
    setInterval(() => { if (document.visibilityState === 'visible') this.pull(false); }, 20000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.pull(false); });
  },
  async pull(force) {
    try {
      const r = await gh('/branches/' + GH.branch);
      if (!r.ok) throw r;
      const head = (await r.json()).commit.sha;
      if (!force && head === this.lastHead) { syncState = 'on'; return; }
      const res = await Promise.all(COLS.map((c) => readCol(c)));
      COLS.forEach((c, i) => {
        if ((this.pending[c] && this.pending[c].length) || this.flushing[c]) return;
        const o = res[i].obj; S[c] = Object.keys(o).map((id) => Object.assign({ id: id }, o[id]));
      });
      this.lastHead = head; syncState = 'on'; render();
    } catch (e) { syncState = (e && e.status === 401) ? 'key' : 'off'; render(); }
  },
  op(c, kind, id, v) {
    const arr = S[c]; const i = arr.findIndex((x) => x.id === id);
    if (kind === 'set') { const nv = Object.assign({ id: id }, v); if (i >= 0) arr[i] = nv; else arr.push(nv); }
    else if (i >= 0) arr.splice(i, 1);
    render();
    (this.pending[c] = this.pending[c] || []).push({ kind: kind, id: id, v: v });
    clearTimeout(this.timers[c]);
    this.timers[c] = setTimeout(() => this.flush(c), 500);
    return Promise.resolve();
  },
  async flush(c) {
    if (this.flushing[c]) { this.timers[c] = setTimeout(() => this.flush(c), 400); return; }
    const ops = this.pending[c] || []; if (!ops.length) return;
    this.pending[c] = []; this.flushing[c] = true;
    try {
      await writeCol(c, (obj) => { for (const o of ops) { if (o.kind === 'set') obj[o.id] = o.v; else delete obj[o.id]; } }, (PNAME[UI.me] || 'Cineva') + ': ' + c);
      syncState = 'on';
    } catch (e) {
      this.pending[c] = ops.concat(this.pending[c] || []);
      syncState = (e && e.status === 401) ? 'key' : 'off';
      toast('Nu s-a salvat încă, reîncerc');

  startRemote(db) {

    for (const c of COLS) {
      const u = db.collection(c).onSnapshot((snap) => {
        S[c] = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
        if (!snap.metadata.fromCache) { first++; if (first >= COLS.length) { clearTimeout(timer); syncState = 'on'; } }
        render();
      }, (err) => {

  },
  queue(key, fn) {

      else if (e && e.code === 'invalid_argument') toast('Nu am putut salva. Poate n-ai drept de scriere aici.');

  }

function shrink(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const max = 900, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob((b) => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

function niceNum(x) {
  if (x >= 10) return String(Math.round(x));
  const r = Math.round(x * 4) / 4;
  const whole = Math.floor(r), frac = r - whole;
  const f = frac === .25 ? '¼' : frac === .5 ? '½' : frac === .75 ? '¾' : '';
  return (whole ? String(whole) : (f ? '' : '0')) + f;
}
function scaleText(t, k) {
  if (!t || k === 1) return t || '';
  return String(t).replace(/(\d+(?:[.,]\d+)?)/g, (m) => niceNum(parseFloat(m.replace(',', '.')) * k));
}

  if (r.intro) h += '<p class="intro">' + esc(r.intro) + '</p>';
  h += '<div class="rbtns"><button class="btn-p" data-a="rlist">Pune în listă</button><button class="btn-s" style="border:1px solid var(--edge)" data-a="rmenu">Pune în meniu</button></div>';
  h += '<p class="sec">Ingrediente</p>';
  if (r.servings) h += '<div class="portii"><span>Pentru câte porții</span><button data-a="rminus" aria-label="Mai puține porții">−</button><b>' + c.serv + '</b><button data-a="rplus" aria-label="Mai multe porții">+</button></div>';
  h += '<div class="ring">' + (r.ingr || []).map((x) => '<div class="ri">' + thumb(x, true) + '<span class="tx"><span>' + esc(x.name) + '</span>' + (x.note ? '<small>' + esc(x.note) + '</small>' : '') + '</span><span class="am">' + esc(scaleText(x.say, k)) + '</span></div>').join('') + '</div>';
  if (r.serve && r.serve.length) h += '<p class="sec" style="font-size:17px">La servit</p><div class="ring">' + r.serve.map((x) => '<div class="ri">' + thumb(x, true) + '<span class="tx"><span>' + esc(x.name) + '</span></span><span class="am">' + esc(scaleText(x.say, k)) + '</span></div>').join('') + '</div>';
  h += '<p class="sec">Cum se face</p><ol class="steps">' + (r.steps || []).map((s, i) => '<li><b>' + (i + 1) + '</b><div>' + (s.t ? '<strong>' + esc(s.t) + '</strong>' : '') + esc(s.d || s) + '</div></li>').join('') + '</ol>';
  if (r.tips && r.tips.length) h += '<p class="sec">Sfaturi</p><div class="tips">' + r.tips.map((t) => '<p>' + esc(t) + '</p>').join('') + '</div>';
  if (r.source && r.source.url) h += '<a class="src" href="' + esc(r.source.url) + '" target="_blank" rel="noopener">Rețeta originală: ' + esc(r.source.title || r.source.url) + ' ↗</a>';
  $('#rbody').innerHTML = h;
}
function recShopList(r, k) {
  return (r.ingr || []).concat(r.serve || []).filter((x) => x.qty).map((x) => {
    const st = STEP_UNITS2[x.unit] || 1;
    const q = Math.max(st, Math.ceil((x.qty * k) / st - 1e-9) * st);
    return { name: x.name, unit: x.unit, cat: x.cat || 'alt', qty: Math.round(q * 100) / 100, on: !x.pantry };
  });
}

/* ---------- căutare jos ---------- */
function searchCatalog(v, n) {
  const own = S.items.concat(S.dishes.flatMap((d) => d.ingr || [])).map((x) => ({ name: x.name, unit: x.unit, cat: x.cat || 'alt' }));
  const all = CATALOG.concat(own.filter((o) => !CATALOG.some((c) => norm(c.name) === norm(o.name))));
  const seen = new Set(); const starts = [], has = [];
  for (const c of all) {
    const k = norm(c.name); if (seen.has(k)) continue;
    if (k.startsWith(v) || k.split(' ').some((w) => w.startsWith(v))) { starts.push(c); seen.add(k); }
    else if (k.includes(v)) { has.push(c); seen.add(k); }
  }
  return starts.sort((a, b) => a.name.length - b.name.length).concat(has).slice(0, n);
}
function hideSugg() { $('#sugg').hidden = true; }
function showSugg() {
  const raw = $('#q').value.trim(); const v = norm(raw);
  if (UI.tab === 'retete') { hideSugg(); if (UI.rq !== v) { UI.rq = v; render(); } return; }
  if (!v || sheetOpen) { hideSugg(); return; }
  let h = '';
  if (UI.tab === 'lista') {
    const hits = searchCatalog(v, 7);
    h = hits.map((x) => '<button class="sopt" role="option" data-a="add" data-v="' + esc(x.name) + '">' + thumb(x, true) + '<span class="nm">' + esc(x.name) + '</span><span class="un">' + esc(x.unit) + '</span></button>').join('');
    if (!hits.some((x) => norm(x.name) === v)) h += '<button class="sopt" role="option" data-a="add" data-v="' + esc(raw) + '">' + thumb({name: '', cat: 'alt'}, true) + '<span class="nm">Adaugă „' + esc(raw) + '”</span></button>';
  } else {
    const ds = S.dishes.filter((d) => norm(d.name).includes(v)).slice(0, 5);
    h = ds.map((d) => '<button class="sopt" role="option" data-a="qadd" data-v="' + esc(d.name) + '"><span class="nm">' + esc(d.name) + '</span><span class="un">salvată</span></button>').join('');
    if (!ds.some((d) => norm(d.name) === v)) h += '<button class="sopt" role="option" data-a="qadd" data-v="' + esc(raw) + '"><span class="nm">Pune „' + esc(raw) + '” la De făcut curând</span></button>';
  }
  $('#sbox').innerHTML = h; $('#sugg').hidden = false;
}
$('#q').addEventListener('input', showSugg);
$('#camfile').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) cameraTaken(f); });
$('#q').addEventListener('focus', showSugg);
$('#q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); const first = $('#sbox').querySelector('.sopt'); if (first && !$('#sugg').hidden) first.click(); }
  if (e.key === 'Escape') { $('#q').value = ''; hideSugg(); $('#q').blur(); }
});
document.addEventListener('pointerdown', (e) => { if (!e.target.closest('.sugg') && !e.target.closest('.search')) hideSugg(); });

/* ---------- clicuri ---------- */
const A = {
  tab(v) { UI.tab = v; UI.rq = ''; try { history.replaceState(null, '', '#' + v); } catch (e) {} $('#q').value = ''; hideSugg(); render(); window.scrollTo(0, 0); },
  store(v) { UI.store = v; ls.set('store', v); render(); },
  who() { A.who2(); const af = $('#afile'); if (af) af.addEventListener('change', async (e) => { const f = e.target.files && e.target.files[0]; if (!f) return; try { toast('Urc poza…'); const b = await shrinkSq(f); const r = await putPhoto('avatar-' + UI.me, b); const cur = (S.meta.find((m) => m.id === 'avatare') || {}); const nv = Object.assign({}, strip(cur)); nv[UI.me] = r.src; await Store.set('meta', 'avatare', nv); closeSheet(); render(); toast('Gata, ai poză'); } catch (er) { toast('Nu am putut urca poza'); } }); },
  who2() { openSheet('<h3>Cine ești?</h3><p class="sub">Alege-te pe tine, ca să apară lângă ce pui în listă.</p><div class="people">' + PEOPLE.map((p) => '<button class="person" data-a="setme" data-v="' + p.id + '"><i>' + face(p.id, 36) + '</i>' + p.name + '</button>').join('') + '</div>' +
    (UI.me && GH.token ? '<label class="chip soft" style="position:relative;display:inline-flex;align-items:center;margin-top:14px;cursor:pointer">Pune-ți poza de profil<input type="file" accept="image/*" id="afile" style="position:absolute;width:1px;height:1px;opacity:0"></label>' : '') + (GH.token ? '<button class="linkbtn" style="margin-top:12px;color:var(--danger)" data-a="forget">Scoate cheia de pe telefonul ăsta</button>' : '')); },
  forget0() {},
  forget() { ls.set('ghtoken', ''); location.reload(); },
  async savekey() {
    const k = ($('#gkey').value || '').trim();
    if (k.length < 20) { toast('Cheia pare prea scurtă'); return; }
    $('#gbtn').disabled = true; $('#gbtn').textContent = 'Verific…';
    GH.token = k;
    try {
      const r = await gh('');
      if (!r.ok) throw r;
      const j = await r.json(); GH.branch = j.default_branch || 'main';
      ls.set('ghtoken', k); ls.set('ghbranch', GH.branch);
      needKey = false; closeSheet(); Store.startGH(); toast('Gata, ești conectat');
    } catch (e) {
      GH.token = ''; $('#gbtn').disabled = false; $('#gbtn').textContent = 'Intră';
      toast(e && e.status === 401 ? 'Cheia nu e bună' : e && e.status === 404 ? 'Cheia nu are acces la ce-luam-date' : 'Nu m-am putut conecta, încearcă iar');
    }
  },
  setme(v) { UI.me = v; ls.set('me', v); closeSheet(); render(); toast('Salut, ' + PNAME[v] + '!'); },
  add(v) {
    addItem(v);
    $('#q').value = ''; hideSugg();
    toast(v + (curStore().super ? ' e pe listă' : ' e pe lista de ' + curStore().name));
  },
  quick(v) { addItem(v); toast(v + ' e pe listă'); },
  tick(v) {
    const it = S.items.find((i) => i.id === v); if (!it) return;
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
    Store.set('items', it.id, Object.assign(strip(it), { done: !it.done, doneAt: Date.now() }));
  },
  edit(v) { editSheet(v); },
  qminus() { const c = sheetCtx; const s = STEP_UNITS[c.unit] || 1; c.qty = Math.max(s, Math.round((c.qty - s) * 100) / 100); $('#eq').textContent = fmtQty(c.qty, c.unit); },
  qplus() { const c = sheetCtx; const s = STEP_UNITS[c.unit] || 1; c.qty = Math.round((c.qty + s) * 100) / 100; $('#eq').textContent = fmtQty(c.qty, c.unit); },
  eseg(v, el) { sheetCtx.store = v; el.parentNode.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === el)); },
  esave() {
    const c = sheetCtx; const it = S.items.find((i) => i.id === c.id); if (!it) return closeSheet();
    const note = $('#enote').value.trim();
    Store.set('items', it.id, Object.assign(strip(it), { qty: c.qty, store: c.store, note: note }));
    closeSheet();
    if (c.store !== it.store) toast('Mutat la ' + STORE_NAME[c.store]);
  },
  edel() { const c = sheetCtx; Store.del('items', c.id); closeSheet(); toast('Șters din listă'); },
  clear() {
    const done = visibleItems().filter((i) => i.done);
    done.forEach((i) => { bumpFreq(i.name); Store.del('items', i.id); });
    toast('Coșul e gol');
  },
  plec() {
    if (!UI.me) return askWho();
    Store.set('meta', 'plecare', { who: UI.me, store: curStore().id, at: Date.now() });
    toast(Store.mode === 'remote' ? 'Ceilalți o să vadă în aplicație că ai plecat' : 'Notat. Când aplicația e comună, o să vadă și ceilalți');
  },
  wk(v) { UI.week += Number(v); render(); },
  day(v) { daySheet(v); },
  dpick(v) {
    const d = S.dishes.find((x) => x.id === v); if (!d) return;
    sheetCtx.dish = d.name; $('#dish').value = d.name;
    if (!sheetCtx.ingr.length) sheetCtx.ingr = (d.ingr || []).map((x) => Object.assign({}, x));
    drawIngr(); drawDishSugg();
  },
  ipick(v) { pushIngr(v); },
  iminus(v) { const x = sheetCtx.ingr[v]; const s = STEP_UNITS[x.unit] || 1; x.qty = Math.max(s, Math.round((x.qty - s) * 100) / 100); drawIngr(); },
  iplus(v) { const x = sheetCtx.ingr[v]; const s = STEP_UNITS[x.unit] || 1; x.qty = Math.round((x.qty + s) * 100) / 100; drawIngr(); },
  idel(v) { sheetCtx.ingr.splice(Number(v), 1); drawIngr(); },
  dsave() {
    const c = sheetCtx; const dish = ($('#dish').value || '').trim();
    if (!dish) { Store.del('menu', c.key); closeSheet(); return; }
    Store.set('menu', c.key, { dish: dish, ingr: c.ingr, who: UI.me || '', at: Date.now() });
    if (c.ingr.length || !S.dishes.some((d) => d.id === slug(dish))) Store.set('dishes', slug(dish), { name: dish, ingr: c.ingr });
    closeSheet(); toast(dish + ' e în meniu');
  },
  dclear() { Store.del('menu', sheetCtx.key); closeSheet(); },
  send() { sendSheet(); },
  stog(v) { const x = sheetCtx.list[v]; x.on = !x.on; drawSend(); },
  sgo() {
    const l = sheetCtx.list.filter((x) => x.on);
    l.forEach((x) => addItem(x.name, x.qty, x.unit, x.cat, { store: 'any' }));
    closeSheet(); toast('Am pus ' + (l.length === 1 ? '1 produs' : l.length + ' produse') + ' în listă');
  },
  qadd(v) {
    v = String(v).trim(); if (!v) return;
    Store.set('queue', rid(), { name: v, at: Date.now() });
    $('#q').value = ''; hideSugg(); toast(v + ' e la De făcut curând');
  },
  qpick(v) { queueSheet(v); },
  qday(v) {
    const c = sheetCtx; const saved = S.dishes.find((d) => d.id === slug(c.name));
    Store.set('menu', v, { dish: c.name, ingr: saved ? saved.ingr || [] : [], who: UI.me || '', at: Date.now() });
    Store.del('queue', c.id); closeSheet(); toast(c.name + ' e în meniu');
  },
  qdel() { Store.del('queue', sheetCtx.id); closeSheet(); },
  rec(v) { if (sheetOpen) { sheetOpen = false; } recipeSheet(v); },
  rplus() { sheetCtx.serv = Math.min(60, sheetCtx.serv + 1); drawRecipe(); },
  rminus() { sheetCtx.serv = Math.max(1, sheetCtx.serv - 1); drawRecipe(); },
  rlist() {
    const r = S.recipes.find((x) => x.id === sheetCtx.id); if (!r) return;
    const k = r.servings ? sheetCtx.serv / r.servings : 1;
    const list = recShopList(r, k);
    sheetOpen = false;
    openChecklist(list, 'Pentru ' + sheetCtx.serv + ' porții. Atinge ce aveți deja în casă, sarea și condimentele sunt deja scoase.');
  },
  rmenu() {
    const r = S.recipes.find((x) => x.id === sheetCtx.id); if (!r) return;
    const k = r.servings ? sheetCtx.serv / r.servings : 1;
    const base = new Date(); const days = [0, 1, 2, 3, 4, 5, 6, 7].map((i) => addDays(base, i));
    const ctx = { name: r.name, ingr: recShopList(r, k).map((x) => ({ name: x.name, qty: x.qty, unit: x.unit, cat: x.cat })) };
    sheetOpen = false;
    openSheet('<h3>' + esc(r.name) + '</h3><p class="sub">Pe ce zi o gătiți?</p><div class="days7">' +
      days.map((d, i) => '<button data-a="rday" data-v="' + ymd(d) + '">' + (i === 0 ? 'Azi' : i === 1 ? 'Mâine' : ZILE[d.getDay()] + ' ' + d.getDate()) + '</button>').join('') + '</div>' +
      '<div class="acts"><button class="btn-s" data-a="close">Renunță</button></div>', ctx);
  },
  rday(v) {
    const c = sheetCtx;
    Store.set('menu', v, { dish: c.name, ingr: c.ingr, who: UI.me || '', at: Date.now() });
    if (!S.dishes.some((d) => d.id === slug(c.name))) Store.set('dishes', slug(c.name), { name: c.name, ingr: c.ingr });
    closeSheet(); toast(c.name + ' e în meniu');
  },
  stores() { storesSheet(); },
  sdel(v) {
    const st = storeOf(v); if (!st) return;
    if (storesList().length <= 1) { toast('Trebuie să rămână măcar un magazin'); return; }
    Store.set('stores', v, Object.assign({}, st, { hidden: true }));
    if (UI.store === v) { UI.store = storesList().filter((x) => x.id !== v)[0].id; ls.set('store', UI.store); }
    storesSheet(); toast(st.name + ' a fost scos');
  },
  ssup(v) { sheetCtx.sup = !sheetCtx.sup; const b = $('#ssup'); b.classList.toggle('on', sheetCtx.sup); b.setAttribute('aria-pressed', sheetCtx.sup); },
  sadd() {
    const nm = ($('#sname').value || '').trim(); if (!nm) { toast('Scrie numele magazinului'); return; }
    let id = slug(nm); if (storeOf(id) && !storeOf(id).hidden) { toast('Magazinul există deja'); return; }
    const order = Math.max(0, ...storesList().map((x) => x.order || 0)) + 1;
    Store.set('stores', id, { name: nm, super: !!sheetCtx.sup, order: order });
    UI.store = id; ls.set('store', id); closeSheet(); render(); toast(nm + ' e în listă');
  },
  camadd() {
    const nm = ($('#cname').value || '').trim(); if (!nm) { toast('Scrie ce e în poză'); return; }
    const c = sheetCtx; const known = findCat(nm);
    const it = { id: rid(), name: known ? known.name : nm };
    addItemWithPhoto(it.name, c.blob, c.qty || 1);
    closeSheet();
  },
  cminus() { sheetCtx.qty = Math.max(1, (sheetCtx.qty || 1) - 1); $('#cq').textContent = sheetCtx.qty; },
  cplus() { sheetCtx.qty = (sheetCtx.qty || 1) + 1; $('#cq').textContent = sheetCtx.qty; },
  close() { closeSheet(); }
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  e.preventDefault(); fn(el.dataset.v, el, e);
});
window.addEventListener('hashchange', () => { const t = ['#meniu', '#retete'].includes(location.hash) ? location.hash.slice(1) : 'lista'; if (t !== UI.tab) A.tab(t); });

/* ---------- pornire ---------- */
for (const c of COLS) S[c] = [];
if (GH.token) { Store.startGH(); }
else {
  needKey = true; render();
  openSheet('<h3>Cheia familiei</h3><p class="sub">Lipește aici cheia pe care ți-a dat-o Usk. O pui o singură dată pe telefonul ăsta și rămâne salvată.</p>' +
    '<label class="field"><span>Cheia</span><input class="inp" id="gkey" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="github_pat_…"></label>' +
    '<div class="acts"><button class="btn-p" id="gbtn" data-a="savekey">Intră</button></div>');
}
setInterval(() => { if (UI.tab === 'lista' && !sheetOpen && document.activeElement !== $('#q')) render(); }, 60000);
})();
</script>
